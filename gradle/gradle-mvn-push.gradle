apply plugin: 'maven-publish'
apply plugin: 'signing'

version = VERSION_NAME
group = GROUP

afterEvaluate { project ->
    if (isAndroidProject(project)) {
        android.libraryVariants.matching { it.name == "release" }.each { releaseVariant ->
            tasks.register('javadocs', Javadoc) {
                dependsOn 'assembleRelease'
                source = android.sourceSets.main.java.source
                classpath += project.files(
                        files(releaseVariant.javaCompileProvider.get().classpath),
                        project.android.getBootClasspath().join(File.pathSeparator),
                        files("${layout.buildDirectory.get()}/intermediates/classes/release"),
                        files("${layout.buildDirectory.get()}/generated/ap_generated_sources/release/out"),
                        files("$project.rootProject.rootDir/dagger-library-shadow/build/libs/dagger-library-shadow-${project.version}.jar")
                )
                title = null
                options.noTimestamp(false)
            }
        }
    } else {
        tasks.register('javadocs', Javadoc) {
            source = sourceSets.main.java.classesDirectory
            classpath += configurations.compileClasspath
            title = null
            options.noTimestamp(false)
        }
    }
    tasks.register('javadocsJar', Jar) {
        dependsOn javadocs
        archiveClassifier.set('javadoc')
        from javadocs.destinationDir
    }

    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set('sources')
        if (isAndroidProject(project)) {
            from android.sourceSets.main.java.source
        } else {
            from sourceSets.main.allSource
        }
    }
    
    if (isAndroidProject(project)) {
        // For Android projects, configure publishing after components are available
        project.components.configureEach { component ->
            if (component.name == 'release') {
                configurePublishing(project, component)
            }
        }
    } else {
        configurePublishing(project, components.java)
    }
}

def configurePublishing(project, component) {
    project.publishing {
        publications {
            release(MavenPublication) { publication ->
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME
                if (project.tasks.findByName('shadowJar') && project.components.findByName('shadow')) {
                    from project.components.shadow
                } else {
                    from component
                }
                artifact sourcesJar
                artifact javadocsJar
                pom {
                    name = POM_NAME
                    description = POM_DESCRIPTION
                    url = POM_URL
                    packaging = POM_PACKAGING
                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                            distribution = POM_LICENCE_DIST
                        }
                    }
                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }
                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }
                }
            }
        }
    }

    project.signing {
        required = isReleaseBuild() && project.gradle.taskGraph.hasTask("uploadArchives")
        useInMemoryPgpKeys(getSigningKey(), getSigningKeyPassword())
        sign(project.publishing.publications.release)
    }
}