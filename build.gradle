import org.gradle.internal.jvm.Jvm

buildscript {
    repositories {
        maven { url = uri("https://plugins.gradle.org/m2/") }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath libs.com.android.tools.build.gradle
        classpath libs.com.github.ben.manes.gradle.versions.plugin
        classpath libs.io.github.gradle.nexus.publish.plugin
        classpath libs.com.gradleup.shadow
    }
}

plugins {
    alias(libs.plugins.nl.littlerobots.version.catalog.update) apply true
}

apply plugin: "io.github.gradle-nexus.publish-plugin"
apply plugin: "com.github.ben-manes.versions"
apply from: rootProject.file('gradle/gradle-mvn-config.gradle')
apply from: 'dependencies.gradle'
apply from: 'checkstyle.gradle'

def currentJvm = Jvm.current()
def javaVersion = currentJvm.javaVersion.majorVersion
println "Current Java version: $currentJvm (major version: $javaVersion)"
assert javaVersion.toInteger() >= 17 : "Error: Java 17 or higher is required but found Java $javaVersion. Change in " +
        "Settings > Build, Execution and Deployment > Build Tools > Gradle > Gradle JVM"

allprojects {
    apply plugin: 'com.github.ben-manes.versions'

    repositories {
        google()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
        maven { url = uri('https://jitpack.io') }
        mavenCentral()
    }

    buildscript {
        repositories {
            google()
        }
    }

    dependencyUpdates.resolutionStrategy {
        componentSelection { rules ->
            rules.all { ComponentSelection selection ->
                boolean rejected = ['alpha', 'beta', 'rc', 'cr', 'm', 'preview'].any { qualifier ->
                    selection.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
                }
                if (rejected) {
                    selection.reject('Release candidate')
                }
            }
        }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach { options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" }

        tasks.withType(Test).tap {
            configureEach {
                useJUnitPlatform()
                testLogging {
                    exceptionFormat = "full"
                    events "started", "skipped", "passed", "failed"
                    showStandardStreams = true
                }
            }
        }
    }


}

tasks.register('clean', Delete) {
    delete rootProject.getLayout().getBuildDirectory()
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}
versionCatalogUpdate {
    versionSelector {
        !(isNonStable(it.candidate.version) && !isNonStable(it.currentVersion))
    }
}