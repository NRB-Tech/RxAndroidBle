plugins {
    id 'com.android.library'
    id 'groovy-base'
}

apply from: rootProject.file('gradle/gradle-mvn-push.gradle')

android {
    namespace = 'io.nrbtech.rxandroidble.mockrxandroidble'

    compileSdk = libs.versions.compileSDK.get().toInteger()

    defaultConfig {
        minSdkVersion libs.versions.minSDK.get().toInteger()
        targetSdk = libs.versions.targetSDK.get().toInteger()
        aarMetadata {
            minCompileSdk = libs.versions.minCompileSDK.get().toInteger()
        }
    }

    compileOptions {
        sourceCompatibility rootProject.ext.targetCompatibilityVersion
        targetCompatibility rootProject.ext.targetCompatibilityVersion
    }

    publishing {
        singleVariant('release')
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }

    preBuild.dependsOn 'checkstyle'

    sourceSets {
        test {
            java {
                srcDir("../rxandroidble/src/test/java")
            }
        }
    }
    lint {
        abortOnError = false
    }
}

// Create a resolvable configuration for Groovy compilation
configurations {
    groovyCompilerClasspath {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    groovyCompilerClasspath libs.org.apache.groovy
}

// Configure Groovy compilation for unit tests
afterEvaluate {
    ['DebugUnitTest', 'ReleaseUnitTest'].each { variantName ->
        def javaCompileTaskName = "compile${variantName}JavaWithJavac"
        def testTaskName = "test${variantName}"
        
        if (tasks.findByName(javaCompileTaskName) != null) {
            tasks.register("compile${variantName}Groovy", GroovyCompile) {
                def javaCompileTask = tasks.named(javaCompileTaskName).get()
                
                dependsOn javaCompileTask
                
                source = fileTree('src/test/groovy')
                classpath = javaCompileTask.classpath + files(javaCompileTask.destinationDirectory)
                destinationDirectory = javaCompileTask.destinationDirectory
                sourceCompatibility = rootProject.ext.targetCompatibilityVersion
                targetCompatibility = rootProject.ext.targetCompatibilityVersion
                groovyClasspath = configurations.groovyCompilerClasspath
            }
            
            tasks.named(testTaskName).configure {
                dependsOn "compile${variantName}Groovy"
            }
        }
    }
}

dependencies {

    // Test dependencies
    testImplementation libs.org.junit.jupiter.junit.jupiter
    testImplementation libs.org.junit.platform.junit.platform.launcher
    testImplementation libs.org.apache.groovy
    testImplementation libs.org.spockframework.spock.core
    api project(path: ':rxandroidble')
    api libs.io.reactivex.rxjava3.rxjava
}
